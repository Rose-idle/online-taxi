
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/service-order?characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: YOUR_MYSQL_PASSWORD  # 本地运行时改成你的数据库密码
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  application:
    name: service-order
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

logging:
  level:
    com.baomidou: debug
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type:

---
spring:
  config:
    activate:
      on-profile: 8007
server:
  port: 8007

---
spring:
  config:
    activate:
      on-profile: 8008
server:
  port: 8008
